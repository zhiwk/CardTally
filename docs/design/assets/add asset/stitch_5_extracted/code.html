<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fffcf7] dark:bg-stone-950 flex items-center justify-between px-6 h-16 w-full">
<div class="flex items-center gap-4">
<button class="text-[#615d66] dark:text-stone-300 hover:opacity-70 transition-opacity duration-300 scale-95 duration-200 ease-out">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Newsreader'] italic font-medium text-2xl tracking-tight text-[#615d66] dark:text-stone-300">Add Asset</h1>
</div>
<div class="bg-[#fcf9f3] dark:bg-stone-900 h-px w-full absolute bottom-0 opacity-30"></div>
</header>
<main class="pt-24 pb-12 px-6 max-w-lg mx-auto min-h-screen flex flex-col">
<!-- Hero Amount Section -->
<section class="mb-12 pt-8 animate-fade-in">
<p class="text-on-surface-variant font-body text-sm tracking-wide mb-2 opacity-80">Record the balance I hold now</p>
<div class="flex items-baseline gap-2">
<span class="serif text-4xl text-primary-dim font-light">¥</span>
<span class="serif text-6xl font-medium tracking-tight text-on-surface">12,500.00</span>
</div>
<div class="mt-6 w-12 h-0.5 bg-primary-container rounded-full"></div>
</section>
<!-- Form Card -->
<div class="relative bg-surface-container-lowest p-8 rounded-[2rem] shadow-[0_32px_64px_-16px_rgba(56,56,49,0.06)] overflow-hidden">
<!-- Paper Texture Overlay -->
<div class="absolute inset-0 grainy-texture"></div>
<div class="relative z-10 space-y-10">
<!-- Asset Name Input -->
<div class="group">
<label class="block serif text-lg font-medium text-on-surface-variant mb-1 transition-colors group-focus-within:text-primary" for="asset-name">Asset Name</label>
<input class="w-full bg-transparent border-t-0 border-x-0 border-b border-outline-variant/30 py-3 px-0 font-body text-lg focus:ring-0 focus:border-primary transition-all duration-300 placeholder:text-outline-variant/50 placeholder:font-light" id="asset-name" placeholder="e.g., CMB Savings Card" type="text"/>
</div>
<!-- Asset Type Selection -->
<div class="space-y-4">
<label class="block serif text-lg font-medium text-on-surface-variant">Asset Type</label>
<div class="flex flex-wrap gap-3">
<!-- Chip: Bank Card (Active) -->
<button class="px-5 py-2.5 rounded-full bg-primary text-on-primary font-body text-sm font-medium shadow-sm transition-all duration-300 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="credit_card">credit_card</span>
                            Bank Card
                        </button>
<!-- Chip: Cash -->
<button class="px-5 py-2.5 rounded-full bg-secondary-fixed-dim text-on-secondary-fixed-variant font-body text-sm font-medium hover:bg-secondary-container transition-all duration-300 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="payments">payments</span>
                            Cash
                        </button>
<!-- Chip: Alipay -->
<button class="px-5 py-2.5 rounded-full bg-secondary-fixed-dim text-on-secondary-fixed-variant font-body text-sm font-medium hover:bg-secondary-container transition-all duration-300 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="account_balance_wallet">account_balance_wallet</span>
                            Alipay
                        </button>
<!-- Chip: WeChat -->
<button class="px-5 py-2.5 rounded-full bg-secondary-fixed-dim text-on-secondary-fixed-variant font-body text-sm font-medium hover:bg-secondary-container transition-all duration-300 flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]" data-icon="chat_bubble">chat_bubble</span>
                            WeChat
                        </button>
</div>
</div>
</div>
</div>
<!-- Visual Anchor/Illustration Element -->
<div class="mt-12 flex justify-center opacity-40 grayscale-[0.5]">
<div class="relative w-full aspect-video rounded-xl overflow-hidden shadow-sm">
<img alt="abstract texture" class="w-full h-full object-cover" data-alt="soft focus close-up of handmade off-white paper texture with subtle organic fibers and warm natural lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuALm-dy9tzYpuDcZjSXg7PcSPawzmM9XZYjdv4x61QCwaKOdxUCv1JbgiGOktI3baW9BbGb6tRsRY7ENozB6Xl53TOq41NDke4M7-XN_WnQde3OlFASES99_gshzgOtSJxNF8Vy-XNi03ID6PQhfzsEHxdbe4gsX9AV1j78N7Tnn5CsCciTlox4agYVZbRQSrH_LdhjXx3dhTcUv61wOe5wYzK3mytahwLIyr5Bye9uI63VS-qdydUABPSM0Ig3zQRViHxNIq53ovM"/>
<div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent"></div>
</div>
</div>
<!-- Primary Action -->
<div class="mt-auto pt-12 pb-4">
<button class="w-full bg-[#2D2A32] text-surface-bright py-5 rounded-3xl font-body font-semibold text-lg tracking-wide hover:opacity-90 active:scale-[0.98] transition-all duration-300 shadow-xl shadow-[#2D2A32]/10">
                Save Asset
            </button>
<p class="text-center text-on-surface-variant/40 font-body text-xs mt-4 tracking-widest uppercase">Secured Financial Journal</p>
</div>
</main>
<!-- Bottom Sheet / Glassmorphism Decoration (Passive) -->
<div class="fixed bottom-0 left-0 right-0 h-1.5 bg-primary/10 blur-xl"></div>
