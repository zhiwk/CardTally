<!DOCTYPE html>

<html class="light" lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Assistant - CardTally</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-surface-variant": "#65655c",
                    "surface-tint": "#615d66",
                    "tertiary-fixed": "#f4e3ce",
                    "primary-dim": "#55515a",
                    "surface-container-lowest": "#ffffff",
                    "on-tertiary-fixed": "#4a3f31",
                    "outline": "#818178",
                    "surface-variant": "#eae8de",
                    "on-primary-fixed": "#413e46",
                    "on-surface": "#383831",
                    "error-dim": "#4f0116",
                    "on-secondary-container": "#435647",
                    "inverse-primary": "#f2ebf6",
                    "on-error-container": "#782232",
                    "on-secondary": "#ffffff",
                    "secondary-fixed-dim": "#c5dac7",
                    "tertiary-container": "#f4e3ce",
                    "on-primary": "#fcf5ff",
                    "error-container": "#ff8b9a",
                    "secondary": "#56695a",
                    "primary": "#615d66",
                    "on-tertiary-container": "#5d5242",
                    "secondary-container": "#d3e8d5",
                    "on-primary-container": "#545059",
                    "surface-dim": "#e4e3d7",
                    "error": "#a54453",
                    "on-secondary-fixed": "#314436",
                    "background": "#fffcf7",
                    "inverse-surface": "#0e0e0c",
                    "tertiary": "#6f6252",
                    "primary-fixed-dim": "#d9d2dd",
                    "surface": "#fffcf7",
                    "primary-container": "#e7e0eb",
                    "surface-container-low": "#fcf9f3",
                    "surface-container-high": "#f0eee5",
                    "on-background": "#383831",
                    "inverse-on-surface": "#9e9d98",
                    "on-tertiary-fixed-variant": "#685b4c",
                    "tertiary-dim": "#635647",
                    "primary-fixed": "#e7e0eb",
                    "tertiary-fixed-dim": "#e6d5c1",
                    "secondary-dim": "#4a5d4e",
                    "secondary-fixed": "#d3e8d5",
                    "surface-container": "#f6f4ec",
                    "on-tertiary": "#ffffff",
                    "surface-bright": "#fffcf7",
                    "outline-variant": "#babab0",
                    "on-secondary-fixed-variant": "#4d6051",
                    "on-primary-fixed-variant": "#5e5a63",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#eae8de"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "2xl": "1rem",
                    "3xl": "1.5rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Newsreader"],
                    "body": ["Manrope"],
                    "label": ["Manrope"]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Manrope', sans-serif; background-color: #fffcf7; color: #383831; }
        .font-newsreader { font-family: 'Newsreader', serif; }
        .font-manrope { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .active-icon {
            font-variation-settings: 'FILL' 1, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        .glass-nav {
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fffcf7]/95 dark:bg-stone-950/85 glass-nav flex items-center justify-between px-6 h-16 no-border tonal-transition">
<div class="flex items-center gap-4">
<button class="text-[#615d66] hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<h1 class="font-newsreader text-2xl tracking-tight italic font-semibold text-[#2D2A32] dark:text-stone-100">AI Assistant</h1>
</div>
<div class="flex items-center">
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-white/20">
<img alt="User profile portrait" class="w-full h-full object-cover" data-alt="softly lit studio portrait of a woman with a gentle expression, elegant editorial lighting and warm skin tones" src="https://lh3.googleusercontent.com/aida-public/AB6AXuArPLTtzq39dG5pYvqhkSy5BgMujTODkomL4xXhQ0GibqDrk1CVBynIxDPCwj0krixrBvJhdahGIA_-iXRzsDPjWbTz9vYeFMbP64wKLHb5aUP6AFjlB-9UTbAma_eIYr8ZD871iTyJ0Bk8WX1yi3EQswem75xScWQbDTeFRpXTYtWqtUVavH9KiN8mTdbhEJVHE2XQdbbksYwR4O481R5oAe9fL3Uk86PSIM7MaEjrWqAcqDdtBCtMxicz9xnOTbFYIS4qkKLKy2M"/>
</div>
</div>
</header>
<!-- Content Canvas (Chat Interface) -->
<main class="flex-1 w-full max-w-2xl px-4 pt-24 pb-48 flex flex-col gap-8">
<!-- AI Message -->
<div class="flex flex-col items-start max-w-[85%] self-start">
<span class="font-newsreader italic text-xs mb-1.5 ml-2 text-outline">Assistant</span>
<div class="bg-surface-container-low p-5 rounded-3xl rounded-bl-none shadow-sm">
<p class="font-body text-[15px] leading-relaxed text-on-surface">你好！有什么我可以帮助你的吗？</p>
</div>
</div>
<!-- User Message -->
<div class="flex flex-col items-end max-w-[85%] self-end">
<span class="font-manrope font-medium text-[10px] mb-1.5 mr-2 text-outline uppercase tracking-wider">You</span>
<div class="bg-primary text-on-primary p-5 rounded-3xl rounded-br-none shadow-sm">
<p class="font-body text-[15px] leading-relaxed">帮我记录一笔晚餐，35元</p>
</div>
</div>
<!-- AI Message (Confirmation) -->
<div class="flex flex-col items-start max-w-[85%] self-start">
<span class="font-newsreader italic text-xs mb-1.5 ml-2 text-outline">Assistant</span>
<div class="bg-surface-container-low p-5 rounded-3xl rounded-bl-none shadow-sm">
<p class="font-body text-[15px] leading-relaxed text-on-surface">好的，已为你识别到支出 **35元**。这笔费用是属于 **餐饮美食** 类别吗？</p>
</div>
</div>
</main>
<!-- Bottom Input Area and Navigation -->
<div class="fixed bottom-0 w-full flex flex-col items-center z-40 pointer-events-none">
<div class="w-full max-w-2xl px-6 pb-2 space-y-4">
<!-- Input Field (Pill Shape) -->
<footer class="w-full pointer-events-auto mb-20">
<div class="bg-surface-container-high/90 glass-nav p-1.5 pl-6 rounded-full flex items-center shadow-[0_12px_48px_rgba(0,0,0,0.08)] border border-white/40">
<input class="flex-1 bg-transparent border-none focus:ring-0 text-on-surface font-body placeholder:text-outline/60 text-[15px]" placeholder="对话您的私人财务管家..." type="text"/>
<div class="flex items-center gap-1">
<button class="w-11 h-11 flex items-center justify-center rounded-full text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="mic">mic</span>
</button>
<button class="w-11 h-11 bg-primary text-on-primary flex items-center justify-center rounded-full shadow-md hover:opacity-90 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined text-[20px]" data-icon="send">send</span>
</button>
</div>
</div>
</footer>
</div>
<!-- New Standard Bottom Card Navigation Bar -->
<nav class="fixed bottom-0 left-0 w-full z-50 bg-[#fffcf7]/85 dark:bg-stone-900/85 backdrop-blur-xl rounded-t-3xl shadow-[0_-8px_32px_0_rgba(56,56,49,0.04)] pointer-events-auto flex justify-around items-center px-4 pb-6 pt-3">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-[#babab0] dark:text-stone-500 px-3 py-1 hover:text-[#615d66] dark:hover:text-stone-200 transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-sans text-[10px] tracking-wide uppercase font-medium mt-0.5">Home</span>
</a>
<!-- Ledger -->
<a class="flex flex-col items-center justify-center text-[#babab0] dark:text-stone-500 px-3 py-1 hover:text-[#615d66] dark:hover:text-stone-200 transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-sans text-[10px] tracking-wide uppercase font-medium mt-0.5">Ledger</span>
</a>
<!-- Assets -->
<a class="flex flex-col items-center justify-center text-[#babab0] dark:text-stone-500 px-3 py-1 hover:text-[#615d66] dark:hover:text-stone-200 transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="database">database</span>
<span class="font-sans text-[10px] tracking-wide uppercase font-medium mt-0.5">Assets</span>
</a>
<!-- AI Agent (Active) -->
<a class="flex flex-col items-center justify-center text-[#615d66] dark:text-stone-100 bg-[#f0eee5] dark:bg-stone-800 rounded-xl px-3 py-1 active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="smart_toy" style="font-variation-settings: 'FILL' 1;">smart_toy</span>
<span class="font-sans text-[10px] tracking-wide uppercase font-medium mt-0.5">AI Agent</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-[#babab0] dark:text-stone-500 px-3 py-1 hover:text-[#615d66] dark:hover:text-stone-200 transition-colors active:scale-95 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="person">person</span>
<span class="font-sans text-[10px] tracking-wide uppercase font-medium mt-0.5">Profile</span>
</a>
</nav>
</div>
<!-- Decorative Canvas Background -->
<div class="fixed inset-0 -z-10 bg-background pointer-events-none opacity-50 overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] rounded-full bg-secondary-container/20 blur-[120px]"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[400px] h-[400px] rounded-full bg-tertiary-container/20 blur-[100px]"></div>
</div>
</body></html>
