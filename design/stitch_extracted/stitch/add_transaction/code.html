<style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; }
        .font-headline { font-family: 'Manrope', sans-serif; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .glass-header { background: rgba(248, 249, 250, 0.8); backdrop-filter: blur(20px); }
        .primary-gradient { background: linear-gradient(135deg, #4e6073 0%, #425467 100%); }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="text-on-surface selection:bg-secondary-container">
<!-- Top Navigation (Shell suppressed but providing task header) -->
<header class="fixed top-0 w-full z-50 glass-header">
<div class="flex justify-between items-center px-8 h-24 w-full">
<button class="flex items-center justify-center w-12 h-12 rounded-full surface-container-low text-on-surface-variant hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-headline font-extrabold text-on-surface tracking-tight text-xl uppercase tracking-widest">New Transaction</h1>
<button class="text-error font-headline font-bold text-sm tracking-tight hover:opacity-70 transition-opacity">
                DELETE
            </button>
</div>
</header>
<main class="pt-32 pb-48 px-8 max-w-[1256px] mx-auto min-h-screen flex flex-col">
<!-- Hero Amount Input Section -->
<section class="mb-20 text-center">
<label class="font-label text-outline uppercase tracking-[0.2em] text-[10px] font-bold mb-4 block">Enter Amount</label>
<div class="relative inline-block w-full max-w-2xl">
<span class="absolute left-0 top-1/2 -translate-y-1/2 font-headline font-light text-4xl text-outline-variant">$</span>
<input autofocus="" class="w-full bg-transparent border-none text-center font-headline font-extrabold text-8xl tracking-tighter text-on-surface focus:ring-0 p-0 placeholder-surface-variant" type="text" value="0.00"/>
<div class="w-full h-[2px] bg-surface-container-highest mt-4 mx-auto max-w-xs transition-colors focus-within:bg-secondary"></div>
</div>
</section>
<div class="space-y-16">
<!-- Category Selection: Asymmetrical Bento Layout -->
<section>
<div class="flex justify-between items-end mb-6">
<h2 class="font-headline font-bold text-lg text-on-surface tracking-tight">Select Category</h2>
<span class="font-label text-outline text-xs tracking-wider">BROWSE ALL</span>
</div>
<div class="grid grid-cols-6 gap-4">
<!-- Food & Dining -->
<div class="col-span-3 aspect-square surface-container-lowest rounded-full flex flex-col items-center justify-center p-6 border-2 border-secondary ring-4 ring-secondary/5 transition-transform active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-4xl text-secondary mb-3" data-icon="restaurant" style="font-variation-settings: 'FILL' 1;">restaurant</span>
<span class="font-label text-[11px] font-bold uppercase tracking-widest text-secondary">Dining</span>
</div>
<!-- Travel -->
<div class="col-span-3 aspect-square surface-container-low rounded-full flex flex-col items-center justify-center p-6 hover:bg-surface-container-highest transition-all active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-4xl text-on-surface-variant mb-3" data-icon="flight">flight</span>
<span class="font-label text-[11px] font-bold uppercase tracking-widest text-outline">Travel</span>
</div>
<!-- Work -->
<div class="col-span-2 aspect-square surface-container-low rounded-full flex flex-col items-center justify-center p-4 hover:bg-surface-container-highest transition-all active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-3xl text-on-surface-variant mb-2" data-icon="work">work</span>
<span class="font-label text-[10px] font-bold uppercase tracking-widest text-outline">Work</span>
</div>
<!-- Health -->
<div class="col-span-2 aspect-square surface-container-low rounded-full flex flex-col items-center justify-center p-4 hover:bg-surface-container-highest transition-all active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-3xl text-on-surface-variant mb-2" data-icon="health_and_safety">health_and_safety</span>
<span class="font-label text-[10px] font-bold uppercase tracking-widest text-outline">Health</span>
</div>
<!-- Shopping -->
<div class="col-span-2 aspect-square surface-container-low rounded-full flex flex-col items-center justify-center p-4 hover:bg-surface-container-highest transition-all active:scale-95 cursor-pointer">
<span class="material-symbols-outlined text-3xl text-on-surface-variant mb-2" data-icon="shopping_bag">shopping_bag</span>
<span class="font-label text-[10px] font-bold uppercase tracking-widest text-outline">Shop</span>
</div>
</div>
</section>
<!-- Metadata: Date & Account Selection -->
<section class="grid grid-cols-1 gap-8">
<div class="flex flex-col space-y-2">
<label class="font-label text-outline uppercase tracking-[0.2em] text-[10px] font-bold">Billing Account</label>
<div class="surface-container-low rounded-full px-8 py-6 flex items-center justify-between hover:bg-surface-container-highest transition-colors cursor-pointer group">
<div class="flex items-center space-x-4">
<div class="w-10 h-10 rounded-lg primary-gradient flex items-center justify-center">
<span class="material-symbols-outlined text-white text-xl" data-icon="account_balance_wallet">account_balance_wallet</span>
</div>
<div>
<p class="font-headline font-bold text-on-surface">Private Reserve Platinum</p>
<p class="text-outline text-xs tracking-wide">Ends in •• 4902</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="flex flex-col space-y-2">
<label class="font-label text-outline uppercase tracking-[0.2em] text-[10px] font-bold">Transaction Date</label>
<div class="surface-container-low rounded-full px-8 py-6 flex items-center justify-between hover:bg-surface-container-highest transition-colors cursor-pointer group">
<div class="flex items-center space-x-4">
<div class="w-10 h-10 rounded-lg surface-container-highest flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant text-xl" data-icon="calendar_today">calendar_today</span>
</div>
<div>
<p class="font-headline font-bold text-on-surface">Today, October 24</p>
<p class="text-outline text-xs tracking-wide">14:30 PM</p>
</div>
</div>
<span class="material-symbols-outlined text-outline-variant group-hover:text-primary transition-colors" data-icon="edit_calendar">edit_calendar</span>
</div>
</div>
</section>
<!-- Notes Section: Minimalist editorial style -->
<section class="flex flex-col space-y-4">
<label class="font-label text-outline uppercase tracking-[0.2em] text-[10px] font-bold">Additional Notes</label>
<div class="relative">
<textarea class="w-full bg-transparent border-none p-0 font-body text-on-surface text-lg leading-relaxed focus:ring-0 placeholder-outline-variant" placeholder="e.g. Business dinner at The Ritz..." rows="3"></textarea>
<div class="absolute bottom-0 left-0 w-full h-[1px] bg-outline-variant/15"></div>
</div>
<!-- Visual Divider as Art -->
<div class="pt-8 flex justify-center">
<div class="w-1 h-1 rounded-full bg-outline-variant/30 mx-1"></div>
<div class="w-1 h-1 rounded-full bg-outline-variant/30 mx-1"></div>
<div class="w-1 h-1 rounded-full bg-outline-variant/30 mx-1"></div>
</div>
</section>
</div>
<!-- Attachment/receipt Placeholder (Editorial touch) -->
<section class="mt-16 mb-20">
<div class="border-2 border-dashed border-outline-variant/20 rounded-full py-10 flex flex-col items-center justify-center text-outline hover:border-secondary/30 transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-3xl mb-2 group-hover:text-secondary transition-colors" data-icon="add_a_photo">add_a_photo</span>
<span class="font-label text-[11px] font-bold uppercase tracking-widest">Attach Receipt</span>
</div>
</section>
</main>
<!-- Fixed Action Button Footer (Task Focused) -->
<footer class="fixed bottom-0 left-0 w-full glass-header px-8 pb-12 pt-6">
<div class="max-w-[1256px] mx-auto flex flex-col space-y-4">
<button class="w-full primary-gradient h-20 rounded-full flex items-center justify-center space-x-3 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-white" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline font-bold text-white text-lg tracking-wide">Save Transaction</span>
</button>
<button class="w-full h-14 flex items-center justify-center">
<span class="font-label text-outline text-xs font-bold uppercase tracking-[0.3em]">Discard Draft</span>
</button>
</div>
</footer>
<!-- Image for Contextual Background (Subtle Texture) -->
<div class="fixed inset-0 -z-10 opacity-[0.03] pointer-events-none">
<img alt="" class="w-full h-full object-cover" data-alt="abstract architectural close-up of smooth marble and concrete surfaces with soft natural daylight and shadows" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB7Lzho3CtxiXiv-kBPyKfgoOwPDoGtn_yNgaiLuLx9oCcTTJdDTkmP2NHtYvL5dd4jPi5pXhFk-TBfGfqkqRdMvrRhKCkjXVDuziQhHZ_2Gq10k2PmQAwHxbMEdtR-EgNtgqvyNA21yOrG3wJ7uS_R0fhHnkk37po4baA_M6KmAz8Otf-eHLLLnqRRoObtfqS14AB46iHsBt9mIkeWHEelNa-cC4s4iScETtSFZBt9GXjN8uxT_EKpcSoQaQLnclevm4aTGfeIU8Q"/>
</div>
</body></html>
