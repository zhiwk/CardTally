<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,700;1,400&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
                  "inverse-surface": "#0e0e0c",
                  "secondary-dim": "#4a5d4e",
                  "secondary": "#56695a",
                  "primary-fixed-dim": "#d9d2dd",
                  "tertiary-dim": "#635647",
                  "surface-tint": "#615d66",
                  "surface-bright": "#fffcf7",
                  "on-tertiary-fixed": "#4a3f31",
                  "tertiary": "#6f6252",
                  "on-primary-fixed": "#413e46",
                  "surface-dim": "#e4e3d7",
                  "on-tertiary": "#ffffff",
                  "error-container": "#ff8b9a",
                  "outline": "#818178",
                  "error": "#a54453",
                  "on-tertiary-fixed-variant": "#685b4c",
                  "on-secondary": "#ffffff",
                  "on-secondary-container": "#435647",
                  "on-secondary-fixed": "#314436",
                  "background": "#fffcf7",
                  "secondary-fixed": "#d3e8d5",
                  "surface": "#fffcf7",
                  "primary-dim": "#55515a",
                  "tertiary-fixed": "#f4e3ce",
                  "surface-container-lowest": "#ffffff",
                  "on-surface-variant": "#65655c",
                  "on-background": "#383831",
                  "on-error-container": "#782232",
                  "on-tertiary-container": "#5d5242",
                  "on-primary-container": "#545059",
                  "surface-container-highest": "#eae8de",
                  "on-error": "#ffffff",
                  "secondary-fixed-dim": "#c5dac7",
                  "inverse-on-surface": "#9e9d98",
                  "tertiary-container": "#f4e3ce",
                  "outline-variant": "#babab0",
                  "on-primary": "#fcf5ff",
                  "surface-container": "#f6f4ec",
                  "error-dim": "#4f0116",
                  "primary-container": "#e7e0eb",
                  "surface-variant": "#eae8de",
                  "surface-container-high": "#f0eee5",
                  "on-surface": "#383831",
                  "tertiary-fixed-dim": "#e6d5c1",
                  "primary-fixed": "#e7e0eb",
                  "on-secondary-fixed-variant": "#4d6051",
                  "on-primary-fixed-variant": "#5e5a63",
                  "inverse-primary": "#f2ebf6",
                  "primary": "#615d66",
                  "surface-container-low": "#fcf9f3",
                  "secondary-container": "#d3e8d5"
          },
          "borderRadius": {
                  "DEFAULT": "0.25rem",
                  "lg": "0.5rem",
                  "xl": "0.75rem",
                  "2xl": "1rem",
                  "3xl": "1.5rem",
                  "full": "9999px"
          },
          "fontFamily": {
                  "headline": ["Newsreader", "serif"],
                  "body": ["Manrope", "sans-serif"],
                  "label": ["Manrope", "sans-serif"]
          }
        },
      },
    }
  </script>
<style>
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #fffcf7;
      color: #383831;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      font-size: 20px;
    }
    .serif-display {
      font-family: 'Newsreader', serif;
    }
    .ragged-right {
      text-align: left;
      max-width: 90%;
    }
    .glass-nav {
      background: rgba(252, 252, 247, 0.85);
      backdrop-filter: blur(30px);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#fffcf7] dark:bg-[#1c1b17] flex items-center justify-between px-6 h-16 w-full">
<button class="text-[#615d66] dark:text-[#cac4cf] hover:opacity-70 transition-opacity tap-highlight-none active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-['Newsreader'] italic text-2xl text-[#615d66] dark:text-[#cac4cf]">New Entry</h1>
<div class="w-6"></div> <!-- Balance spacer -->
</header>
<main class="flex-grow pt-24 pb-32 px-8 max-w-lg mx-auto w-full">
<!-- Hero Section: Amount Input -->
<section class="mb-12">
<p class="font-label text-label-md text-on-surface-variant uppercase tracking-widest mb-2 opacity-60">Amount</p>
<div class="flex items-baseline gap-2">
<span class="serif-display text-4xl font-light text-primary">¥</span>
<input class="serif-display text-7xl font-light bg-transparent border-none p-0 focus:ring-0 text-on-background w-full selection:bg-primary-container" type="text" value="0.00"/>
</div>
</section>
<!-- Subtly Styled Toggle -->
<div class="flex p-1 bg-surface-container-low rounded-full w-fit mb-12">
<button class="px-8 py-2 rounded-full font-label text-sm font-medium bg-primary text-on-primary transition-all duration-300">Expense</button>
<button class="px-8 py-2 rounded-full font-label text-sm font-medium text-on-surface-variant hover:bg-surface-container transition-all duration-300">Income</button>
</div>
<!-- Minimalist Ledger Inputs -->
<div class="space-y-8 mb-16">
<div class="relative">
<label class="block serif-display text-xl text-primary-dim italic mb-1">When</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant border-opacity-30 py-2 font-body text-lg focus:ring-0 focus:border-primary transition-colors px-0" type="text" value="Today, March 27"/>
</div>
<div class="relative">
<label class="block serif-display text-xl text-primary-dim italic mb-1">Detail</label>
<input class="w-full bg-transparent border-0 border-b border-outline-variant border-opacity-30 py-2 font-body text-lg focus:ring-0 focus:border-primary transition-colors px-0 placeholder:text-outline-variant" placeholder="Add a note..." type="text"/>
</div>
</div>
<!-- Category Grid -->
<section class="mb-12">
<p class="font-label text-label-md text-on-surface-variant uppercase tracking-widest mb-6 opacity-60">Category</p>
<div class="grid grid-cols-4 gap-y-10 gap-x-4">
<button class="flex flex-col items-center gap-3 active:scale-95 transition-transform">
<div class="w-14 h-14 rounded-3xl bg-primary text-on-primary flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined" data-icon="restaurant" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant">Food</span>
</button>
<button class="flex flex-col items-center gap-3 opacity-60 hover:opacity-100 active:scale-95 transition-all">
<div class="w-14 h-14 rounded-3xl bg-surface-container-high text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="directions_car">directions_car</span>
</div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant">Transport</span>
</button>
<button class="flex flex-col items-center gap-3 opacity-60 hover:opacity-100 active:scale-95 transition-all">
<div class="w-14 h-14 rounded-3xl bg-surface-container-high text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="shopping_bag">shopping_bag</span>
</div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant">Shop</span>
</button>
<button class="flex flex-col items-center gap-3 opacity-60 hover:opacity-100 active:scale-95 transition-all">
<div class="w-14 h-14 rounded-3xl bg-surface-container-high text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="medication">medication</span>
</div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant">Health</span>
</button>
<button class="flex flex-col items-center gap-3 opacity-60 hover:opacity-100 active:scale-95 transition-all">
<div class="w-14 h-14 rounded-3xl bg-surface-container-high text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="home">home</span>
</div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant">Rent</span>
</button>
<button class="flex flex-col items-center gap-3 opacity-60 hover:opacity-100 active:scale-95 transition-all">
<div class="w-14 h-14 rounded-3xl bg-surface-container-high text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="movie">movie</span>
</div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant">Fun</span>
</button>
<button class="flex flex-col items-center gap-3 opacity-60 hover:opacity-100 active:scale-95 transition-all">
<div class="w-14 h-14 rounded-3xl bg-surface-container-high text-primary flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="bolt">bolt</span>
</div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant">Bills</span>
</button>
<button class="flex flex-col items-center gap-3 opacity-40 hover:opacity-100 active:scale-95 transition-all">
<div class="w-14 h-14 rounded-3xl border border-dashed border-outline-variant text-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="add">add</span>
</div>
<span class="font-label text-[11px] uppercase tracking-wider text-on-surface-variant">More</span>
</button>
</div>
</section>
</main>
<!-- BottomNavBar (The Footer Shell) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-8 pb-8 pt-4 bg-[#fffcf7]/85 dark:bg-[#1c1b17]/85 backdrop-blur-xl rounded-t-[24px] shadow-[0_-8px_32px_rgba(56,56,49,0.04)]">
<button class="flex flex-col items-center justify-center text-[#615d66] opacity-60 px-6 py-3 hover:bg-[#f0eee5] dark:hover:bg-[#2b2922] transition-colors rounded-full duration-300">
<span class="material-symbols-outlined mb-1" data-icon="arrow_back">arrow_back</span>
<span class="font-['Manrope'] font-medium text-[10px] tracking-wider uppercase">Cancel</span>
</button>
<button class="flex flex-col items-center justify-center bg-[#615d66] text-[#fffcf7] rounded-full px-8 py-3 Active: scale-98 transition-transform duration-300 ease-out hover:opacity-70 transition-opacity">
<span class="material-symbols-outlined mb-1" data-icon="done_all">done_all</span>
<span class="font-['Manrope'] font-medium text-[10px] tracking-wider uppercase">Save Entry</span>
</button>
</nav>
<!-- Optional Simulated Numerical Keyboard Area Shade -->
<div class="h-12 w-full bg-surface-container-low opacity-20 pointer-events-none fixed bottom-0 left-0"></div>
</body></html>
